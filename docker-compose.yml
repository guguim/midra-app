version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: midra-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: midra
      POSTGRES_PASSWORD: midra_password
      POSTGRES_DB: midradb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
